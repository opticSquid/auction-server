kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 4000 # Internal cluster port
        hostPort: 4000 # Port on your browser/localhost
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 4001
        hostPort: 4001
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 4002
        hostPort: 4002
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 4003
        hostPort: 4003
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 4004
        hostPort: 4004
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 4005
        hostPort: 4005
        listenAddress: "127.0.0.1"
        protocol: TCP

kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        service-node-port-range: 4000-4999
